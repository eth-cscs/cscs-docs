name: build docs (PR)

on:
  pull_request:
    branches: ['main']
permissions:
  contents: write
jobs:
  deploy:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: astral-sh/setup-uv@v10
      # skip caching until zensical has stabilised cache interface
      #- run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      #- uses: actions/cache@v3
      #  with:
      #    key: zensical-${{ env.cache_id }}
      #    path: .cache
      #    restore-keys: |
      #      zensical-
      # build the preview for the URL that it will be served from
      - run: |
          ./build --site-url "https://cscs-docs-preview.svc.cscs.ch/${{ github.event.pull_request.number }}" \
                  --archive upload/site.tar.gz
          echo ${{ github.event.pull_request.number }} > upload/pr_number.txt
      - name: Upload docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: upload
          if-no-files-found: error
