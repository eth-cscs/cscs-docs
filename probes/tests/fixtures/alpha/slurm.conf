# A small invented cluster that uses the features of slurm.conf that the probes
# rely on: defaults, continuation lines, node sets, a hidden partition, and
# limits that are set by a QoS rather than by the partition.
ClusterName=alpha

NodeName=DEFAULT Sockets=2 CoresPerSocket=64 ThreadsPerCore=2 RealMemory=500000
NodeName=nid[001001-001010] Feature=gpu,fast Gres=gpu:4 \
    RealMemory=800000
# 100 MB more than the nodes above: the same node type once rounded to GB.
NodeName=nid[001011-001016] Feature=gpu Gres=gpu:4 RealMemory=800100
NodeName=nid[002001-002002] Sockets=1 CoresPerSocket=16 ThreadsPerCore=1 Feature=xfer

NodeSet=gpunodes Feature=gpu

PartitionName=DEFAULT DefaultTime=01:00:00 MaxTime=1-00:00:00 State=UP
PartitionName=normal Default=YES Nodes=gpunodes QOS=normalp AllowQos=normal,stop PriorityTier=20 OverSubscribe=EXCLUSIVE
PartitionName=debug Nodes=gpunodes MaxNodes=8 qos=debug-qos AllowQoS=normal,stop MaxTime=30 DefaultTime=30 PreemptMode=off
PartitionName=big Nodes=gpunodes AllowQos=big,stop AllowAccounts=proj1 MaxTime=2-0 PriorityTier=30
PartitionName=xfer Nodes=nid[002001-002002] MaxNodes=1 OverSubscribe=FORCE:10
PartitionName=staff Nodes=ALL Hidden=YES AllowGroups=staff
